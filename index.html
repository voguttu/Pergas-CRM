    <div class="mt-5 text-center container lpage">

      <script>
        // Check if the URL has a message parameter with the value "fail"
        const urlParams = new URLSearchParams(window.location.search);
        const failMessage = urlParams.get('message');

        if (failMessage === 'fail') {
          const errorMessage = document.createElement('div');
          errorMessage.className = 'alert alert-danger mt-3';
          errorMessage.textContent = 'Incorrect username or password. Please try again.';
          document.querySelector('.container.lpage').appendChild(errorMessage);
        }
      </script>
				
		<h5 class="">Login</h5>
		<form class="mt-3" action="authentication.php" method="post">
			<input type="text" class="form-control" name="username" placeholder="Username" id="username" required>
			<div class="input-group mt-3">
        <input class='form-control' type="password" name="password" placeholder="password" id="password" required>
        <div class="input-group-append">
            <span class="input-group-text" id="toggle-password">
              <i style="color: #0d6efd" class="fa-solid fa-eye-slash fa-2x"></i>
            </span>
        </div>
      </div>
			<button type="submit" class="btn btn-primary my-4 w-100">Login</button>
		</form>
	</div>

<script>
  document.getElementById("toggle-password").addEventListener("click", function () {
      var passwordInput = document.getElementById("password");
      if (passwordInput.type === "password") {
          passwordInput.type = "text";
      } else {
          passwordInput.type = "password";
      }
  });
</script>
